name: Validate MemorableDay.in

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-memorableday-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install website dependencies
        run: npm install --no-audit --no-fund

      - name: Verify the single backend route
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('vercel.json', 'utf8'));
          const proxy = (config.rewrites || []).find((item) => item.source === '/api/:path*');
          if (proxy?.destination !== 'https://memorableday-downloader-api-id9q.onrender.com/:path*') {
            throw new Error('Vercel API proxy is not pointing to the active Render service.');
          }
          if (existsSync('api/v1/inspect.js') || existsSync('api/v1/download.js')) {
            throw new Error('Legacy Vercel downloader functions must not shadow the Render proxy.');
          }
          console.log('Single backend route is configured correctly.');
          NODE

      - name: Build multi-site downloader container
        run: docker build --tag memorableday-downloader-api:ci ./server

      - name: Smoke test downloader API container
        run: |
          docker run -d --name memorableday-api-ci -p 10000:10000 memorableday-downloader-api:ci
          trap 'docker logs memorableday-api-ci || true; docker rm -f memorableday-api-ci || true' EXIT
          for attempt in $(seq 1 25); do
            if curl --fail --silent http://127.0.0.1:10000/health; then
              exit 0
            fi
            sleep 1
          done
          echo "Downloader API did not become healthy"
          exit 1

      - name: Build Astro website for Vercel
        env:
          VERCEL: "1"
        run: npm run build
